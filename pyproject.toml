[project]
name = "step-audio-editx"
version = "0.1.0"
description = "Step-Audio-EditX (Apple Silicon MPS / macOS Compatible)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "ffmpeg-python>=0.2.0",
    "funasr>=1.3.0",
    "gradio>=4.0.0",
    "hdbscan>=0.8.30",
    "hyperpyyaml>=1.2.3",
    "librosa>=0.10.0",
    "onnxruntime>=1.18.0",
    "openai-whisper>=20231117",
    "rotary-embedding-torch>=0.8.0",
    "sox>=1.4.0",
    "torch-complex>=0.4.4",
    "transformers>=4.40.0",
    "typer>=0.12.0",
    "whisper>=1.1.10",

    # --- Deep Learning Framework (MPS & CPU support on macOS) ---
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "torchvision>=0.19.0",
    "accelerate>=0.30.0",
    
    # --- Training & Audio Utilities ---
    "datasets>=2.19.0",
    "conformer>=0.3.2",
    "diffusers",
    "modelscope",
    "numpy>=1.26.0",
    "omegaconf>=2.3.0",
    "protobuf>=4.25.0",
    "sentencepiece",
    "six>=1.16.0",
    "soundfile>=0.12.1",
    
    # --- UI & Visualization ---
    "matplotlib>=3.8.0",
    "pillow",
]

[tool.uv]
index-strategy = "unsafe-best-match"
